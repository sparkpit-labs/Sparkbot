name: Windows Roundtable Installer
on:
  push:
    branches: [packaging/windows-local-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Public safety
        shell: bash
        run: bash scripts/check-public-safety.sh
      - name: Install build dependencies
        run: |
          python -m pip install -e "backend[dev]" pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tests
        run: |
          $env:PYTHONPATH = "$PWD/backend"
          python -m pytest backend/tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test --prefix frontend -- --run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build backend and connector
        run: |
          python -m PyInstaller --onefile --clean --noconfirm --paths backend --name sparkbot-server --distpath src-tauri/binaries backend/desktop_launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --onefile --clean --noconfirm --name sparkbot-roundtable --distpath src-tauri/binaries tools/sparkbot-roundtable.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke-desktop.py src-tauri/binaries/sparkbot-server.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & src-tauri/binaries/sparkbot-roundtable.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item src-tauri/binaries/sparkbot-server.exe src-tauri/binaries/sparkbot-server-x86_64-pc-windows-msvc.exe
          Move-Item src-tauri/binaries/sparkbot-roundtable.exe src-tauri/binaries/sparkbot-roundtable-x86_64-pc-windows-msvc.exe
      - name: Build desktop frontend
        run: |
          $env:VITE_SPARKBOT_API_BASE_URL = 'http://127.0.0.1:18765'
          $env:VITE_SPARKBOT_DESKTOP = 'true'
          npm run build --prefix frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned NSIS
        run: |
          $env:RUSTFLAGS = "--remap-path-prefix=$PWD=/source"
          npx --yes @tauri-apps/cli@2.10.0 build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checksums and provenance
        run: |
          $directory = 'src-tauri/target/release/bundle/nsis'
          $installers = Get-ChildItem "$directory/*.exe"
          if (!$installers) { throw 'No installer was produced' }
          $installers | ForEach-Object { $hash = Get-FileHash $_.FullName -Algorithm SHA256; "$($hash.Hash)  $($_.Name)" } | Set-Content "$directory/SHA256SUMS.txt"
          "Source: $env:GITHUB_SHA`nRepository: $env:GITHUB_REPOSITORY`nUnsigned Windows pilot. Clean-machine installer acceptance pending." | Set-Content "$directory/BUILD-NOTES.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: sparkbot-roundtable-windows-unsigned
          path: src-tauri/target/release/bundle/nsis/
          if-no-files-found: error
          retention-days: 14
