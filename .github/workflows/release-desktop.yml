name: Desktop release (Windows, macOS, Linux)

# Builds the Sparkbot Roundtable desktop app on all three platforms.
# - A push to a release/** branch builds and tests everything and keeps the
#   installers as Actions artifacts. Nothing is published.
# - Pushing a tag that matches site/release.json (for example v0.0.01) also
#   publishes a GitHub Release with the installers and puts the download page
#   from site/ on the gh-pages branch, which GitHub Pages serves.
# - "Run workflow" (available once this file is on the default branch) builds,
#   and publishes too when "publish" is ticked.
on:
  push:
    branches: ['release/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub Release and the download page
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows-x64, os: windows-latest, bundles: nsis }
          - { id: linux-x64, os: ubuntu-22.04, bundles: 'deb,appimage' }
          - { id: macos-arm64, os: macos-15, bundles: dmg }
          - { id: macos-x64, os: macos-15-intel, bundles: dmg }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Release label and version agree
        run: python scripts/release-info.py --check --github-output "$GITHUB_OUTPUT" --ref "$GITHUB_REF"
        id: info
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf file
      - name: Public safety
        run: bash scripts/check-public-safety.sh
      - name: Install build dependencies
        run: |
          python -m pip install -e "backend[dev]" pyinstaller==6.16.0
          npm ci --prefix frontend
      - name: Tests
        run: |
          PYTHONPATH="$PWD/backend" python -m pytest backend/tests -q
          npm test --prefix frontend -- --run
      - name: Freeze backend and connector
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          python -m PyInstaller --onefile --clean --noconfirm --paths backend --name sparkbot-server --distpath src-tauri/binaries backend/desktop_launcher.py
          python -m PyInstaller --onefile --clean --noconfirm --name sparkbot-roundtable --distpath src-tauri/binaries tools/sparkbot-roundtable.py
          python scripts/smoke-desktop.py "src-tauri/binaries/sparkbot-server${ext}"
          "src-tauri/binaries/sparkbot-roundtable${ext}" --help > /dev/null
          mv "src-tauri/binaries/sparkbot-server${ext}" "src-tauri/binaries/sparkbot-server-${triple}${ext}"
          mv "src-tauri/binaries/sparkbot-roundtable${ext}" "src-tauri/binaries/sparkbot-roundtable-${triple}${ext}"
      - name: Build desktop frontend
        env:
          VITE_SPARKBOT_API_BASE_URL: http://127.0.0.1:18765
          VITE_SPARKBOT_DESKTOP: 'true'
        run: npm run build --prefix frontend
      - name: Build unsigned desktop package
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/source
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles ${{ matrix.bundles }}
      - name: Disposable Windows install and lock checks
        if: runner.os == 'Windows'
        run: |
          installer="$(ls src-tauri/target/release/bundle/nsis/*.exe | head -n 1)"
          python scripts/smoke-installer.py "$installer"
      - name: Collect packages under their download names
        run: |
          label="${{ steps.info.outputs.label }}"
          base="Sparkbot-Roundtable-${label}-${{ matrix.id }}"
          bundle="src-tauri/target/release/bundle"
          mkdir -p release-assets
          one() { # exactly one file must match
            local found=( $1 )
            if [ "${#found[@]}" -ne 1 ] || [ ! -f "${found[0]}" ]; then echo "Expected one file for $1"; ls -R "$bundle" || true; exit 1; fi
            cp "${found[0]}" "release-assets/$2"
          }
          case "${{ matrix.id }}" in
            windows-x64) one "$bundle/nsis/*.exe" "${base}-setup.exe" ;;
            linux-x64)   one "$bundle/deb/*.deb" "${base}.deb"; one "$bundle/appimage/*.AppImage" "${base}.AppImage" ;;
            macos-*)     one "$bundle/dmg/*.dmg" "${base}.dmg" ;;
          esac
          ls -la release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release label
        id: info
        run: python3 scripts/release-info.py --check --github-output "$GITHUB_OUTPUT" --ref "$GITHUB_REF"
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Checksums and build notes
        working-directory: release-assets
        run: |
          sha256sum Sparkbot-Roundtable-* > SHA256SUMS.txt
          printf 'Source: %s\nRepository: %s\nUnsigned builds. No automatic updates.\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" > BUILD-NOTES.txt
          cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="${{ steps.info.outputs.label }}"
          if gh release view "$label" > /dev/null 2>&1; then
            gh release upload "$label" release-assets/* --clobber
          else
            gh release create "$label" release-assets/* --target "$GITHUB_SHA" --prerelease \
              --title "Sparkbot Roundtable ${label}" --notes-file "docs/RELEASE_NOTES_${label}.md"
          fi

  pages:
    name: Publish download page
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Put site/ on the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="$(python3 scripts/release-info.py | sed -n 's/^label=//p')"
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Download page for ${label} (${GITHUB_SHA})"
          # The branch holds only the generated page, so it is replaced each time.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
